[package]
name = "relay-native-authority-research"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["rt", "macros"] }

uuid = { version = "=1.20.0", features = ["v7"] }
