[workspace]
members = [
    "crates/relay-cli",
    "crates/relay-core",
    "crates/relay-herdr",
    "crates/relay-provider-claude",
    "crates/relay-provider-codex",
    "crates/relay-testkit",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
fd-lock = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "allow"
