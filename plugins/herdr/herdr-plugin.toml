# Agent Relay's Herdr plugin manifest.
#
# LIVE-VERIFIED against Herdr 0.9.0 (M3.2): linked with `herdr plugin link`, all five actions
# below invoked for real against real adopted profiles on a disposable project, including one
# full controlled bidirectional handoff (see `docs/herdr-integration.md`, `M3_FINAL_REPORT.md`).
#
# Every action below is deliberately parameterless (current Herdr plugins take no action
# parameters — docs/herdr-integration.md). Which profile/fallback an action uses comes from two
# Herdr-native `tokens` (set once via `herdr pane|workspace report-metadata --token ...`), never
# typed in per invocation:
#   relay_profile           = the Relay profile this pane/workspace maps to
#   relay_profile_fallback  = comma-separated fallback priority list (used by watch/handoff)

id = "agent-relay"
name = "Agent Relay"
version = "0.1.0"
description = "Safe transactional handoff of Claude Code sessions between isolated authenticated profiles."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Compiles the plugin's own binary post-checkout, the same pattern
# `senna-lang/herdr-agent-usage` uses (`plugin install` always replaces the managed directory with
# a fresh checkout, so there is nothing to compile-once-and-keep). Requires the same Rust
# toolchain the main `agent-relay` repository already pins (`rust-toolchain.toml`).
#
# Also builds `relay` itself: Herdr spawns plugin/build commands with the server's own PATH,
# which will not have a system-installed `relay` on it (confirmed live, M3.2) — the plugin binary
# falls back to this same workspace's `target/release/relay` when `HERDR_PLUGIN_ROOT` indicates a
# locally linked plugin (see `relay-herdr-plugin`'s `discover_relay_client`).
[[build]]
command = ["cargo", "build", "--release", "--bin", "relay-herdr-plugin", "--bin", "relay"]

[[actions]]
id = "status"
title = "Relay: Status"
contexts = ["pane"]
command = ["../../target/release/relay-herdr-plugin", "status"]

[[actions]]
id = "doctor"
title = "Relay: Doctor"
contexts = ["pane"]
command = ["../../target/release/relay-herdr-plugin", "doctor"]

[[actions]]
id = "recovery"
title = "Relay: Recovery Status"
contexts = ["pane"]
command = ["../../target/release/relay-herdr-plugin", "recovery"]

[[actions]]
id = "watch"
title = "Relay: Evaluate Usage"
contexts = ["pane"]
command = ["../../target/release/relay-herdr-plugin", "watch"]

[[actions]]
id = "handoff"
title = "Relay: Manual Handoff"
contexts = ["pane"]
command = ["../../target/release/relay-herdr-plugin", "handoff"]

# Automatic orchestration (M3.2, live-verified): fires on every agent status transition in every
# Claude pane, exactly like both reference plugins already do (`herdr-claude-auto-retry`,
# `herdr-agent-usage`), not just panes Relay manages. `HERDR_PLUGIN_CONTEXT_JSON` carries the
# exact same shape here as for an action invocation (confirmed live), so `relay-herdr-plugin`'s
# `watch` mode needs no separate code path. For a pane with no `relay_profile` token this is a
# fast, local, no-API-cost no-op (`ProfileMappingUnknown`/`NonClaudePane`, exit 1, logged and
# ignored by Herdr) — the same cheap-no-op-when-not-opted-in pattern those reference plugins rely
# on. Relay's own cooldown/per-hour cap/known-exhausted ledger (already live-verified, see
# `M3_FINAL_REPORT.md`) is what actually prevents repeated evaluation from repeatedly handing off
# the same session — this event handler adds no throttling of its own on top of that, by design
# ("keep the Herdr adapter thin").
[[events]]
on = "pane.agent_status_changed"
command = ["../../target/release/relay-herdr-plugin", "watch"]
