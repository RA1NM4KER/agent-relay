# Agent Relay's Herdr plugin manifest (M3.1 first slice).
#
# NOT YET LIVE-VERIFIED. Schema confirmed live against installed Herdr 0.9.0 and current
# herdr.dev/docs/plugins/ (see docs/herdr-integration.md), but this manifest itself has not been
# loaded with `herdr plugin link` against a real Herdr server — the M3 safety boundary explicitly
# forbids that tonight. Do not `herdr plugin link` or `herdr plugin install` this until the steps
# in M3_OVERNIGHT_REPORT.md's "exact live validation steps" have been run on a disposable
# workspace with no real account.
#
# Every action below is deliberately parameterless (current Herdr plugins take no action
# parameters — docs/herdr-integration.md). Which profile/fallback an action uses comes from two
# Herdr-native `tokens` (set once via `herdr pane|workspace report-metadata --token ...`), never
# typed in per invocation:
#   relay_profile           = the Relay profile this pane/workspace maps to
#   relay_profile_fallback  = comma-separated fallback priority list (used by watch/handoff)

id = "agent-relay"
name = "Agent Relay"
version = "0.1.0"
description = "Safe transactional handoff of Claude Code sessions between isolated authenticated profiles."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Compiles the plugin's own binary post-checkout, the same pattern
# `senna-lang/herdr-agent-usage` uses (`plugin install` always replaces the managed directory with
# a fresh checkout, so there is nothing to compile-once-and-keep). Requires the same Rust
# toolchain the main `agent-relay` repository already pins (`rust-toolchain.toml`).
[[build]]
command = ["cargo", "build", "--release", "--bin", "relay-herdr-plugin"]

[[actions]]
id = "status"
title = "Relay: Status"
contexts = ["pane"]
command = ["target/release/relay-herdr-plugin", "status"]

[[actions]]
id = "doctor"
title = "Relay: Doctor"
contexts = ["pane"]
command = ["target/release/relay-herdr-plugin", "doctor"]

[[actions]]
id = "recovery"
title = "Relay: Recovery Status"
contexts = ["pane"]
command = ["target/release/relay-herdr-plugin", "recovery"]

[[actions]]
id = "watch"
title = "Relay: Evaluate Usage"
contexts = ["pane"]
command = ["target/release/relay-herdr-plugin", "watch"]

[[actions]]
id = "handoff"
title = "Relay: Manual Handoff"
contexts = ["pane"]
command = ["target/release/relay-herdr-plugin", "handoff"]
